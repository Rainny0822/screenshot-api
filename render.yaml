services:
  - type: web
    name: screenshot-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FREE_QUOTA_PER_DAY
        value: 10
      - key: PAID_QUOTA_PER_MONTH
        value: 1000
